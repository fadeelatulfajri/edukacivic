    <!-- Web Audio Sound Synthesizer -->
    <script>
        let isAudioEnabled = true;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let actx = null;

        function initAudio() {
            if (!actx) actx = new AudioContext();
            if (actx.state === 'suspended') actx.resume();
        }

        function playSound(type) {
            if (!isAudioEnabled) return;
            try {
                initAudio();
                const now = actx.currentTime;

                if (type === 'correct') {
                    const osc = actx.createOscillator();
                    const gain = actx.createGain();
                    osc.connect(gain);
                    gain.connect(actx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'wrong') {
                    const osc = actx.createOscillator();
                    const gain = actx.createGain();
                    osc.connect(gain);
                    gain.connect(actx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(146.83, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'victory') {
                    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
                        const osc = actx.createOscillator();
                        const gain = actx.createGain();
                        osc.connect(gain);
                        gain.connect(actx.destination);
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(f, now + i * 0.1);
                        gain.gain.setValueAtTime(0.35, now + i * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.4);
                        osc.start(now + i * 0.1);
                        osc.stop(now + i * 0.1 + 0.4);
                    });
                }
            } catch(e) {}
        }
    </script>

                    },
                    {
                        text: "Membubarkan kelas dan meniadakan ketua kelas selamanya",
                        isCorrect: false,
                        explain: "Kepemimpinan tetap dibutuhkan dan dapat dipilih melalui mekanisme demokrasi yang sehat."
                    }
                ]
            }
        ];

        const optionLetters = ["A", "B", "C"];
        let currentQuizIndex = 0;
        let correctCount = 0;
        let isAnswering = false;

        function loadQuestion() {
            isAnswering = false;
            const q = quizCases[currentQuizIndex];
            const total = quizCases.length;

            document.getElementById('quiz-step').textContent = `Kasus ${currentQuizIndex + 1} / ${total}`;
            document.getElementById('quiz-case-title').textContent = q.title;
            document.getElementById('quiz-case-story').textContent = q.story;

            const container = document.getElementById('quiz-options-box');
            container.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'case-option-btn w-full text-left p-4 rounded-2xl flex items-start gap-3.5 text-xs sm:text-sm font-medium';
                btn.innerHTML = `
                    <span class="w-7 h-7 rounded-xl bg-purple-950 text-purple-300 font-black flex items-center justify-center shrink-0 text-xs border border-purple-800/60 shadow">
                        ${optionLetters[idx]}
                    </span>
                    <span class="pt-0.5 text-gray-200">${opt.text}</span>
                `;
                btn.onclick = () => handleAnswer(opt, btn);
                container.appendChild(btn);
            });

            document.getElementById('quiz-feedback').classList.add('hidden');
            document.getElementById('quiz-next-action').classList.add('hidden');
        }

        function handleAnswer(opt, clickedBtn) {
            if (isAnswering) return;
            isAnswering = true;

            const allBtns = document.querySelectorAll('.case-option-btn');
            allBtns.forEach(b => b.disabled = true);

            const fb = document.getElementById('quiz-feedback');
            fb.classList.remove('hidden');

            if (opt.isCorrect) {
                correctCount++;
                clickedBtn.classList.add('correct');
                playSound('correct');
                fb.className = 'mt-6 p-4 rounded-2xl text-xs sm:text-sm font-medium bg-emerald-950/80 border border-emerald-500/50 text-emerald-300';
                fb.innerHTML = `
                    <div class="flex items-center gap-2 font-bold mb-1">
                        <i class="fa-solid fa-circle-check text-emerald-400"></i> Analisis Hukum Kamu Tepat Sekali!
                    </div>
                    <p class="text-xs text-emerald-200/90 leading-relaxed">${opt.explain}</p>
                `;
            } else {
                clickedBtn.classList.add('wrong');
                // Highlight correct button
                const correctIdx = quizCases[currentQuizIndex].options.findIndex(o => o.isCorrect);
                if (correctIdx !== -1) allBtns[correctIdx].classList.add('correct');
                playSound('wrong');
                fb.className = 'mt-6 p-4 rounded-2xl text-xs sm:text-sm font-medium bg-red-950/80 border border-red-500/50 text-red-300';
                fb.innerHTML = `
                    <div class="flex items-center gap-2 font-bold mb-1">
                        <i class="fa-solid fa-circle-xmark text-red-400"></i> Analisis Kurang Tepat!
                    </div>
                    <p class="text-xs text-red-200/90 leading-relaxed">${opt.explain}</p>
                `;
            }

            const earnedPoints = Math.round((correctCount / quizCases.length) * 25);
            document.getElementById('session-score').textContent = earnedPoints;
            document.getElementById('quiz-next-action').classList.remove('hidden');
        }

        function advanceToNextQuestion() {
            currentQuizIndex++;
            if (currentQuizIndex < quizCases.length) {
                loadQuestion();
            } else {
                finalizeQuiz();
            }
        }

        function finalizeQuiz() {
            const earnedPoints = Math.round((correctCount / quizCases.length) * 25);
            playSound('victory');
            triggerVictoryConfetti();

            // Record completed in student-system
            if (typeof recordLevelCompleted === 'function') {
                recordLevelCompleted('d4l4', earnedPoints);
            }

            // Render Unified Quiz Celebration Modal for Dunia 4 Completion
            renderQuizCelebration({
                levelKey: 'd4l4',
                score: earnedPoints,
                maxScore: 25,
                correctCount: correctCount,
                totalQuestions: quizCases.length,
                timeText: '02:15',
                modalId: 'result-modal',
                containerId: 'result-content'
            });
        }

        function triggerVictoryConfetti() {
            try {
                confetti({
                    particleCount: 120,
                    spread: 90,
                    origin: { y: 0.6 }
                });
            } catch(e) {}
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateNavbarStudent();
            loadQuestion();
        });
    </script>
</body>
</html>
